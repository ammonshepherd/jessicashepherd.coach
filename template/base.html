<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="{{base_url}}/public/images/favicon.ico">
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=read_more">

    <link rel="stylesheet" href="{{base_url}}/public/css/style.css">
  </head>
<body>
  <header id="header">
    <nav aria-label="Main navigation">
      <div class="topnav">
        <input type="checkbox" id="menu-toggle" aria-label="Toggle navigation menu">
        <label for="menu-toggle" class="icon" aria-hidden="true">
          ☰
          <span class="sr-only">Menu</span>
        </label>

        <a href="{{base_url}}/">Home</a>
        <a href="{{base_url}}/#about">About</a>
        <a href="{{base_url}}/#services">Services</a>
        <a href="{{base_url}}/thoughts/">Thoughts</a>
        <a href="{{base_url}}/#contact">Contact</a>
        <a id="make-appointment-link" href="mailto:me@jessicashepherd.coach">Make Appointment</a>
          
      </div>
    </nav>
  </header>

    {% block content %}{% endblock %}

<footer>
    <div id="footer-section">
      <span>Copyright &copy; <span id="year"></span> Jessica Shepherd</span>
      &because; <span>All rights reserved</span> 
      <!-- &because; <span><a href="#">Privacy Policy</a></span> &because;
      <span><a href="#">Terms and Conditions</a></span> -->
      <div id="pysite">Site by <a href="https://ammonshepherd.github.io/pysite/">pysite</a></div>
    </div>
</footer>

<script>
    const d = new Date()
    let year = d.getFullYear()
    document.getElementById("year").textContent = year
</script>

</body>
</html>
